name: Nightly Build

on:
  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      ksu_sha: ${{ steps.check.outputs.ksu_sha }}
      next_sha: ${{ steps.check.outputs.next_sha }}
      susfs_sha: ${{ steps.check.outputs.susfs_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gh

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/check-upstream.sh

  build:
    needs: check

    if: ${{ fromJson(needs.check.outputs.matrix).include[0] != null }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}

    uses: ./.github/workflows/build.yml

    with:
      target: ${{ matrix.target }}
      variant: ${{ matrix.variant }}

    secrets: inherit

  release:
    needs:
      - check
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - name: Update Nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/release-nightly.sh \
            "${{ needs.check.outputs.ksu_sha }}" \
            "${{ needs.check.outputs.next_sha }}" \
            "${{ needs.check.outputs.susfs_sha }}"
