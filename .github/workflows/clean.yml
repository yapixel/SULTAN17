name: Create Clean SULTAN17 Source Branch

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch/ref"
        required: true
        default: "17.0.0-cp2a"
        type: string

      target_branch:
        description: "New clean source branch"
        required: true
        default: "17.0.0-cp2a-clean"
        type: string

permissions:
  contents: write

concurrency:
  group: sultan17-source-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Validate source
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$GITHUB_REPOSITORY" == "yapixel/SULTAN17" ]] || {
            echo "::error::Wrong repository: $GITHUB_REPOSITORY"
            exit 1
          }

          [[ "${{ inputs.source_ref }}" != "${{ inputs.target_branch }}" ]] || {
            echo "::error::Source and target branch must differ."
            exit 1
          }

          for dir in arch drivers fs include kernel security; do
            [[ -d "$dir" ]] || {
              echo "::error::Missing kernel directory: $dir"
              exit 1
            }
          done

          [[ -f Makefile ]] || {
            echo "::error::Makefile not found."
            exit 1
          }

          VERSION="$(awk '$1=="VERSION" && $2=="=" {print $3; exit}' Makefile)"
          PATCHLEVEL="$(awk '$1=="PATCHLEVEL" && $2=="=" {print $3; exit}' Makefile)"
          SUBLEVEL="$(awk '$1=="SUBLEVEL" && $2=="=" {print $3; exit}' Makefile)"

          echo "Kernel: ${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"

          [[ "${VERSION}.${PATCHLEVEL}.${SUBLEVEL}" == "6.1.162" ]] || {
            echo "::error::Expected Linux 6.1.162."
            exit 1
          }

      - name: Ensure target branch is new
        shell: bash
        run: |
          set -Eeuo pipefail

          TARGET="${{ inputs.target_branch }}"

          if git ls-remote --exit-code --heads origin \
              "refs/heads/${TARGET}" >/dev/null 2>&1; then
            echo "::error::Branch already exists: ${TARGET}"
            exit 1
          fi

      - name: Create target branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git switch -c "${{ inputs.target_branch }}"

      - name: Remove legacy builder infrastructure
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -d gscripts ]]; then
            git rm -r gscripts
          fi

          if [[ -d .github/workflows ]]; then
            git rm -r .github/workflows
          fi

      - name: Verify deletion scope
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Staged changes:"
          git diff --cached --name-status

          BAD_PATHS="$(
            git diff --cached --name-only |
            grep -Ev '^(gscripts/|\.github/workflows/)' || true
          )"

          if [[ -n "$BAD_PATHS" ]]; then
            echo "::error::Unexpected paths changed:"
            printf '%s\n' "$BAD_PATHS"
            exit 1
          fi

          # Every staged change must be a deletion.
          NON_DELETIONS="$(
            git diff --cached --name-status |
            awk '$1 != "D" {print}' || true
          )"

          if [[ -n "$NON_DELETIONS" ]]; then
            echo "::error::Cleanup contains non-deletion changes:"
            printf '%s\n' "$NON_DELETIONS"
            exit 1
          fi

      - name: Audit remaining tracked tree
        shell: bash
        run: |
          set -Eeuo pipefail

          # Search the post-cleanup working tree rather than deleted files
          # staged in the index.
          PATTERN='CONFIG_KSU|CONFIG_KSU_SUSFS|ksu_handle_|KernelSU-Next|susfs4ksu|CONFIG_NOMOUNT|CONFIG_VPNHIDE|vpnhide_next_backend|maxsteeel/nomount'

          set +e
          MATCHES="$(git grep --no-index -n -I -E "$PATTERN" -- . \
            ':!.git' 2>/dev/null)"
          RC=$?
          set -e

          if [[ $RC -eq 0 ]]; then
            echo "::error::Legacy integration residue found:"
            printf '%s\n' "$MATCHES"
            exit 1
          fi

          if [[ $RC -ne 1 ]]; then
            echo "::error::Residue scan failed with code $RC"
            exit "$RC"
          fi

          echo "No legacy integration residue found."

      - name: Verify kernel source integrity
        shell: bash
        run: |
          set -Eeuo pipefail

          REQUIRED_DIRS=(
            arch
            block
            crypto
            drivers
            fs
            include
            init
            ipc
            kernel
            lib
            mm
            net
            security
            scripts
          )

          for dir in "${REQUIRED_DIRS[@]}"; do
            [[ -d "$dir" ]] || {
              echo "::error::Required directory missing: $dir"
              exit 1
            }
          done

          for file in Makefile Kbuild Kconfig COPYING; do
            [[ -f "$file" ]] || {
              echo "::error::Required file missing: $file"
              exit 1
            }
          done

          VERSION="$(awk '$1=="VERSION" && $2=="=" {print $3; exit}' Makefile)"
          PATCHLEVEL="$(awk '$1=="PATCHLEVEL" && $2=="=" {print $3; exit}' Makefile)"
          SUBLEVEL="$(awk '$1=="SUBLEVEL" && $2=="=" {print $3; exit}' Makefile)"

          [[ "${VERSION}.${PATCHLEVEL}.${SUBLEVEL}" == "6.1.162" ]]

      - name: Show final diff
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Source branch : ${{ inputs.source_ref }}"
          echo "Target branch : ${{ inputs.target_branch }}"
          echo
          git diff --cached --stat
          echo
          git status --short

      - name: Commit cleanup
        shell: bash
        run: |
          set -Eeuo pipefail

          git diff --cached --quiet && {
            echo "::error::Nothing to commit."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "cleanup: convert SULTAN17 to source-only repository"

      - name: Push new branch
        shell: bash
        run: |
          set -Eeuo pipefail

          git push \
            --set-upstream origin \
            "${{ inputs.target_branch }}"

      - name: Report
        shell: bash
        run: |
          echo "Clean branch created."
          echo "Branch: ${{ inputs.target_branch }}"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Kernel: 6.1.162"
